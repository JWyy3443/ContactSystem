<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>通讯录系统 - 登录</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            width: 400px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; margin-bottom: 30px; color: #333; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .register-link { text-align: center; margin-top: 20px; }
        .register-link a { color: #667eea; text-decoration: none; cursor: pointer; }
        .error { color: red; text-align: center; margin-top: 15px; display: none; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>📒 通讯录系统</h1>
    <div class="input-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名">
    </div>
    <div class="input-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
    </div>
    <button onclick="login()">登录</button>
    <div class="register-link">
        <a href="register.jsp">还没有账号？立即注册</a>
    </div>
    <div id="errorMsg" class="error"></div>
</div>

<script>
    function login() {
        const username = $('#username').val();
        const password = $('#password').val();

        $.ajax({
            url: '<%= request.getContextPath() %>/api/login',
            type: 'POST',
            data: { username: username, password: password },
            success: function(user) {
                if (user) {
                    window.location.href = 'dashboard.jsp';
                }
            },
            error: function() {
                $('#errorMsg').text('用户名或密码错误').show();
            }
        });
    }
</script>
</body>
</html>
